  <style>
/* ── RESET ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; }
body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: #fff; color: #1a1a1a;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
button { cursor: pointer; background: none; border: none; font: inherit; }

/* ── TOP NAV ────────────────────────────────────────────────── */
.site-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: #fff; border-bottom: 1px solid #e8e8e8;
  height: 60px; display: flex; align-items: center;
  padding: 0 28px; justify-content: space-between;
}
.site-nav__logo { font-size: 15px; font-weight: 400; letter-spacing: 0.01em; white-space: nowrap; flex-shrink: 0; }
.site-nav__right { display: flex; align-items: center; }
.nav-standalone-link {
  padding: 0 18px; height: 60px; display: flex; align-items: center;
  font-size: 14px; color: #1a1a1a; transition: color 0.15s; white-space: nowrap;
}
.nav-standalone-link:hover { color: #555; }
.nav-instagram {
  padding: 0 6px 0 12px; height: 60px; display: flex; align-items: center;
  color: #1a1a1a; transition: color 0.15s;
}
.nav-instagram svg { width: 20px; height: 20px; }

/* ── MOBILE HEADER ──────────────────────────────────────────── */
.mobile-header {
  display: none; position: fixed; top: 0; left: 0; right: 0;
  height: 50px; background: #fff; border-bottom: 1px solid #e8e8e8;
  padding: 0 16px; align-items: center; justify-content: space-between; z-index: 200;
}
.mobile-header__logo { font-size: 14px; font-weight: 400; }

/* ── PAGE BODY ──────────────────────────────────────────────── */
.page-body { padding-top: 60px; min-height: 100vh; display: flex; flex-direction: column; }

/* ── PROJECT HEADER ─────────────────────────────────────────── */
.project-header { padding: 32px 28px 4px; }
.project-header h1 { font-size: 15px; font-weight: 400; letter-spacing: 0.01em; margin-bottom: 6px; }
.project-header p { font-size: 13px; color: #666; font-style: italic; line-height: 1.5; }

/* ── IMAGE GRID (flex columns — flush masonry) ──────────────── */
.project-grid {
  padding: 20px 28px 0;
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.project-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.project-grid__item {
  display: block;
  cursor: pointer;
}
.project-grid__item img {
  width: 100%;
  height: auto;
  display: block;
  transition: opacity 0.25s ease;
}
.project-grid__item:hover img { opacity: 0.84; }

/* ── PREV / NEXT PROJECT BUTTONS ────────────────────────────── */
.proj-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 48px 28px 0;
  gap: 12px;
}
.proj-nav__btn {
  display: inline-flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px 28px;
  border: none;
  text-decoration: none;
  color: #1a1a1a;
  transition: background 0.15s, color 0.15s;
  min-width: 180px;
}
.proj-nav__btn:hover { background: #1a1a1a; color: #fff; }
.proj-nav__btn--next { text-align: right; margin-left: auto; }
.proj-nav__label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: inherit;
  opacity: 0.5;
}
.proj-nav__name {
  font-size: 13px;
  color: inherit;
  letter-spacing: 0.01em;
}

.site-footer {
  padding: 32px 28px 24px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  font-size: 11px;
  color: #aaa;
  letter-spacing: 0.03em;
  position: relative;
}
.site-footer__center {
  text-align: center;
}
.site-footer a { font-size: 12px; color: #1a1a1a; transition: color 0.15s; }
.site-footer a:hover { color: #666; }
.site-footer > *:last-child { text-align: right; }

/* ── LIGHTBOX ───────────────────────────────────────────────── */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 500; display: none;
  align-items: center; justify-content: center;
}
.lightbox.open { display: flex; }
.lightbox__viewer {
  display: flex;
  align-items: center;
  gap: 20px;
  max-width: 96vw;
  max-height: 96vh;
}
.lightbox__img {
  max-width: 80vw; max-height: 88vh;
  object-fit: contain; display: block;
  background: #fff;
  box-shadow: 0 8px 48px rgba(0,0,0,0.18);
}
.lightbox__close {
  position: absolute; top: 20px; right: 24px;
  font-size: 22px; color: #1a1a1a;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: #fff; border: 1px solid #ddd; border-radius: 50%;
  cursor: pointer; line-height: 1; opacity: 0.7; transition: opacity 0.15s;
}
.lightbox__close:hover { opacity: 1; }
.lightbox__prev, .lightbox__next {
  flex-shrink: 0;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #1a1a1a;
  background: #fff; border: 1px solid #ddd; border-radius: 50%;
  cursor: pointer; opacity: 0.7; transition: opacity 0.15s;
  user-select: none; -webkit-user-select: none;
}
.lightbox__prev:hover, .lightbox__next:hover { opacity: 1; }
@media (max-width: 700px) {
  .lightbox__viewer { gap: 12px; }
  .lightbox__img { max-width: 72vw; }
  .lightbox__prev, .lightbox__next { width: 36px; height: 36px; font-size: 18px; }
}

/* ── RESPONSIVE ─────────────────────────────────────────────── */
@media (max-width: 700px) {

  .mobile-header { display: flex; }
  .page-body { padding-top: 50px; }

  .project-grid__item { break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 4px; }
  .proj-nav { padding: 32px 14px 0; flex-wrap: wrap; }
  .proj-nav__btn { min-width: 0; flex: 1; }
  .site-footer { padding: 24px 14px; flex-direction: column; gap: 10px; align-items: flex-start; }
}

  <div class="lightbox__viewer">

<script>
(function () {
  'use strict';

  var lightbox    = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var imgs = [];
  var idx  = 0;

  document.querySelectorAll('[data-lightbox]').forEach(function (el, i) {
    imgs.push(el.dataset.lightbox);
    el.addEventListener('click', function () { idx = i; openLB(imgs[i]); });
  });

  function openLB(src) {
    lightboxImg.src = src;
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLB() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
    document.body.style.overflow = '';
  }
  function prevLB() { idx = (idx - 1 + imgs.length) % imgs.length; lightboxImg.src = imgs[idx]; }
  function nextLB() { idx = (idx + 1) % imgs.length; lightboxImg.src = imgs[idx]; }

  document.getElementById('lightboxClose').addEventListener('click', closeLB);
  document.getElementById('lightboxPrev').addEventListener('click', prevLB);
  document.getElementById('lightboxNext').addEventListener('click', nextLB);
  lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLB(); });
  document.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLB();
    if (e.key === 'ArrowLeft')  prevLB();
    if (e.key === 'ArrowRight') nextLB();
  });

  var swipeStartX = 0;
  lightbox.addEventListener('touchstart', function (e) { swipeStartX = e.changedTouches[0].clientX; }, { passive: true });
  lightbox.addEventListener('touchend', function (e) {
    var diff = swipeStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) { diff > 0 ? nextLB() : prevLB(); }
  }, { passive: true });

})();
</script>
