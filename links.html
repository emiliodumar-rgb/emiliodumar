<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emilio Dümar</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --text: #0a0a0a;
    --muted: #888;
    --border: #e8e8e8;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    font-weight: 300;
  }

  /* ── PAGE ── */
  .page {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 24px 40px;
  }

  /* ── PROFILE ── */
  .profile { text-align: center; margin-bottom: 40px; }

  .avatar-wrap {
    width: 88px; height: 88px; border-radius: 50%;
    overflow: hidden; margin: 0 auto 20px;
    background: #f0f0f0;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-initials { font-size: 28px; font-weight: 700; color: var(--muted); letter-spacing: -0.02em; }

  .profile-name {
    font-size: 30px; font-weight: 700; letter-spacing: -0.02em;
    line-height: 1.1; margin-bottom: 8px;
  }
  .profile-tagline {
    font-size: 13px; color: var(--muted); letter-spacing: 0.06em;
    text-transform: uppercase; font-weight: 400;
  }

  /* ── LINKS ── */
  .links-wrap {
    width: 100%; max-width: 400px;
  }

  .link-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none; color: var(--text);
    margin-bottom: 10px;
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.01em;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    opacity: 0;
    animation: linkIn 0.4s ease forwards;
  }
  .link-item:hover { background: var(--text); color: #fff; border-color: var(--text); }
  .link-arrow {
    font-size: 13px; opacity: 0.4; transition: opacity 0.15s, transform 0.15s;
    flex-shrink: 0;
  }
  .link-item:hover .link-arrow { opacity: 1; transform: translateX(3px); }

  @keyframes linkIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── ADMIN TRIGGER ── */
  .admin-trigger {
    margin-top: 48px; font-size: 11px; color: #ddd;
    letter-spacing: 0.08em; text-transform: uppercase;
    cursor: default; user-select: none; transition: color 0.2s;
  }
  .admin-trigger:hover { color: var(--muted); }

  /* ════════════════════════════
     PASSWORD SCREEN
  ════════════════════════════ */
  .password-screen {
    display: none; position: fixed; inset: 0; z-index: 60;
    background: #fff; align-items: center; justify-content: center;
  }
  .password-screen.show { display: flex; }
  .password-box { text-align: center; max-width: 300px; width: 100%; padding: 40px 20px; }
  .password-box h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .password-box p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .password-input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 13px 16px; font-size: 15px; outline: none; text-align: center;
    letter-spacing: 0.08em; margin-bottom: 10px;
    font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
    transition: border-color 0.2s;
  }
  .password-input:focus { border-color: var(--text); }
  .password-btn {
    width: 100%; background: var(--text); color: #fff; border: none;
    border-radius: 8px; padding: 13px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
    transition: background 0.15s;
  }
  .password-btn:hover { background: #333; }
  .password-err { font-size: 12px; color: #c0392b; margin-top: 8px; display: none; }
  .password-err.show { display: block; }

  /* ════════════════════════════
     ADMIN MODAL
  ════════════════════════════ */
  .admin-overlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    align-items: flex-start; justify-content: center; padding: 40px 20px;
  }
  .admin-overlay.show { display: flex; }

  .admin-modal {
    background: #fff; border-radius: 12px; width: 100%; max-width: 560px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }
  .admin-header {
    padding: 22px 28px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: #fff; z-index: 2;
  }
  .admin-header-title { font-size: 15px; font-weight: 700; }
  .admin-x { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); transition: color 0.15s; line-height: 1; }
  .admin-x:hover { color: var(--text); }

  .admin-body { padding: 28px; }
  .admin-section { margin-bottom: 32px; }
  .admin-section-title {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 600; color: var(--muted); margin-bottom: 16px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }

  /* Profile section */
  .admin-photo-row { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  .admin-avatar-preview {
    width: 72px; height: 72px; border-radius: 50%; overflow: hidden;
    background: #f0f0f0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .admin-avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .admin-avatar-preview .preview-initials { font-size: 20px; font-weight: 700; color: var(--muted); }
  .admin-photo-actions { display: flex; flex-direction: column; gap: 8px; }
  .admin-upload-btn {
    border: 1px solid var(--border); background: #fff; border-radius: 6px;
    padding: 8px 14px; font-size: 12px; font-weight: 500; cursor: pointer;
    font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; transition: all 0.15s;
    position: relative; overflow: hidden;
  }
  .admin-upload-btn:hover { border-color: var(--text); }
  .admin-upload-btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .admin-photo-note { font-size: 11px; color: var(--muted); }

  .admin-field { margin-bottom: 14px; }
  .admin-label { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; font-weight: 500; }
  .admin-input {
    width: 100%; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-size: 14px; outline: none;
    font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 300;
    transition: border-color 0.2s; color: var(--text); background: #fff;
  }
  .admin-input:focus { border-color: var(--text); }

  /* Links manager */
  .link-manager-list { margin-bottom: 16px; }
  .link-manager-item {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px;
    display: grid; grid-template-columns: auto 1fr 1fr auto auto;
    gap: 10px; align-items: center;
  }
  .link-manager-item.hidden-link { opacity: 0.45; }
  .link-order-btns { display: flex; flex-direction: column; gap: 2px; }
  .link-order-btn {
    background: none; border: 1px solid var(--border); border-radius: 3px;
    width: 22px; height: 18px; font-size: 10px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center; color: var(--muted);
    transition: all 0.12s;
  }
  .link-order-btn:hover { border-color: var(--text); color: var(--text); }
  .link-order-btn:disabled { opacity: 0.2; cursor: default; }
  .link-label-input, .link-url-input {
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 13px; outline: none;
    font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; font-weight: 300;
    transition: border-color 0.2s; color: var(--text); width: 100%;
  }
  .link-label-input:focus, .link-url-input:focus { border-color: var(--text); }
  .link-vis-btn {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 13px; cursor: pointer; color: var(--muted);
    transition: all 0.12s; white-space: nowrap;
  }
  .link-vis-btn:hover { border-color: var(--text); color: var(--text); }
  .link-vis-btn.is-hidden { background: #f4f4f4; }
  .link-del-btn {
    background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer;
    padding: 0 4px; line-height: 1; transition: color 0.12s;
  }
  .link-del-btn:hover { color: #c0392b; }

  .add-link-btn {
    width: 100%; border: 1px dashed var(--border); border-radius: 8px;
    padding: 12px; font-size: 13px; color: var(--muted); background: none;
    cursor: pointer; font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
    transition: all 0.15s; letter-spacing: 0.02em;
  }
  .add-link-btn:hover { border-color: var(--text); color: var(--text); background: #fafafa; }

  /* Save bar */
  .admin-save-bar {
    padding: 18px 28px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; bottom: 0; background: #fff;
  }
  .admin-save-note { font-size: 12px; color: var(--muted); }
  .admin-saved-msg { font-size: 12px; color: #27ae60; display: none; margin-left: 10px; font-weight: 500; }
  .admin-saved-msg.show { display: inline; }
  .admin-save-btn {
    background: var(--text); color: #fff; border: none; border-radius: 6px;
    padding: 12px 28px; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif; transition: background 0.15s;
  }
  .admin-save-btn:hover { background: #333; }

  @media (max-width: 480px) {
    .page { padding: 48px 20px 32px; justify-content: flex-start; padding-top: 64px; }
    .link-manager-item { grid-template-columns: auto 1fr auto auto; }
    .link-url-input { display: none; }
  }
</style>
</head>
<body>

<!-- PASSWORD -->
<div class="password-screen" id="passwordScreen">
  <div class="password-box">
    <h2>Admin</h2>
    <p>Enter your password to edit this page.</p>
    <input class="password-input" id="passwordInput" type="password" placeholder="Password" />
    <button class="password-btn" onclick="checkPassword()">Sign in</button>
    <div class="password-err" id="passwordErr">Incorrect password.</div>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-modal">
    <div class="admin-header">
      <div class="admin-header-title">Edit Page</div>
      <button class="admin-x" onclick="closeAdmin()">×</button>
    </div>
    <div class="admin-body">

      <!-- Profile -->
      <div class="admin-section">
        <div class="admin-section-title">Profile</div>
        <div class="admin-photo-row">
          <div class="admin-avatar-preview" id="adminAvatarPreview">
            <span class="preview-initials" id="adminAvatarInitials">ED</span>
          </div>
          <div class="admin-photo-actions">
            <label class="admin-upload-btn">
              Upload photo
              <input type="file" accept="image/*" onchange="handlePhotoUpload(this)" />
            </label>
            <span class="admin-photo-note">Cropped to square, auto-compressed.</span>
          </div>
        </div>
        <div class="admin-field">
          <label class="admin-label">Name</label>
          <input class="admin-input" id="a-name" />
        </div>
        <div class="admin-field">
          <label class="admin-label">Tagline</label>
          <input class="admin-input" id="a-tagline" placeholder="e.g. Photographer / Melbourne" />
        </div>
      </div>

      <!-- Links -->
      <div class="admin-section">
        <div class="admin-section-title">Links</div>
        <div class="link-manager-list" id="linkManagerList"></div>
        <button class="add-link-btn" onclick="addLink()">+ Add link</button>
      </div>

    </div>
    <div class="admin-save-bar">
      <div>
        <span class="admin-save-note">Saves to this device.</span>
        <span class="admin-saved-msg" id="savedMsg">Saved.</span>
      </div>
      <button class="admin-save-btn" onclick="saveAdmin()">Save</button>
    </div>
  </div>
</div>

<!-- MAIN PAGE -->
<div class="page">
  <div class="profile">
    <div class="avatar-wrap" id="avatarWrap">
      <span class="avatar-initials" id="avatarInitials">ED</span>
    </div>
    <h1 class="profile-name" id="profileName">Emilio Dümar</h1>
    <p class="profile-tagline" id="profileTagline">Photographer / Melbourne</p>
  </div>

  <div class="links-wrap" id="linksWrap"></div>

  <div class="admin-trigger" onclick="openAdminGate()">···</div>
</div>

<script>
  // ─── CONFIG ───
  var ADMIN_PASSWORD = '212Falafel5!';
  var STORAGE_KEY    = 'emilio_links';

  var DEFAULT = {
    name:    'Emilio Dümar',
    tagline: 'Photographer / Melbourne',
    photo:   '',
    links: [
      { id: 1, label: 'Booking Inquiries',  url: 'booking.html',         visible: true },
      { id: 2, label: 'Network Casting',    url: 'network-casting.html', visible: true },
      { id: 3, label: 'Book a Session',     url: 'book-session.html',    visible: true },
      { id: 4, label: '1:1 Mentoring',      url: 'mentoring.html',       visible: true },
      { id: 5, label: 'Website',            url: '#',                    visible: true },
    ]
  };

  var data;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT));
    if (!data.links) data.links = DEFAULT.links.slice();
  } catch(e) { data = JSON.parse(JSON.stringify(DEFAULT)); }

  // Admin working copy
  var adminPhoto = '';
  var adminLinks = [];
  var nextId = 100;

  // ─── RENDER PAGE ───
  function renderPage() {
    // Name
    document.getElementById('profileName').textContent  = data.name;
    document.getElementById('profileTagline').textContent = data.tagline;
    document.title = data.name;

    // Avatar
    var wrap = document.getElementById('avatarWrap');
    var initials = document.getElementById('avatarInitials');
    if (data.photo) {
      wrap.innerHTML = '<img src="' + data.photo + '" alt="' + data.name + '" />';
    } else {
      wrap.innerHTML = '<span class="avatar-initials" id="avatarInitials">' + getInitials(data.name) + '</span>';
    }

    // Links
    var container = document.getElementById('linksWrap');
    container.innerHTML = '';
    var visible = data.links.filter(function(l){ return l.visible; });
    visible.forEach(function(link, i) {
      var a = document.createElement('a');
      a.className = 'link-item';
      a.href = link.url;
      a.style.animationDelay = (i * 0.07) + 's';
      var span = document.createElement('span'); span.textContent = link.label;
      var arrow = document.createElement('span'); arrow.className = 'link-arrow'; arrow.textContent = '→';
      a.appendChild(span); a.appendChild(arrow);
      container.appendChild(a);
    });
  }

  function getInitials(name) {
    var parts = name.trim().split(' ');
    return parts.map(function(p){ return p[0] || ''; }).slice(0,2).join('').toUpperCase();
  }

  // ─── ADMIN ───
  function openAdminGate() {
    document.getElementById('passwordScreen').classList.add('show');
    setTimeout(function(){ document.getElementById('passwordInput').focus(); }, 100);
  }

  function checkPassword() {
    if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
      document.getElementById('passwordScreen').classList.remove('show');
      document.getElementById('passwordInput').value = '';
      openAdmin();
    } else {
      document.getElementById('passwordErr').classList.add('show');
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordInput').focus();
    }
  }
  document.getElementById('passwordInput').addEventListener('keydown', function(e){ if(e.key==='Enter') checkPassword(); });

  function openAdmin() {
    document.getElementById('a-name').value    = data.name;
    document.getElementById('a-tagline').value = data.tagline;
    adminPhoto = data.photo;
    adminLinks = data.links.map(function(l){ return Object.assign({}, l); });
    renderAdminPhoto();
    renderLinkManager();
    document.getElementById('adminOverlay').classList.add('show');
  }

  function closeAdmin() { document.getElementById('adminOverlay').classList.remove('show'); }

  function saveAdmin() {
    data.name    = document.getElementById('a-name').value.trim() || data.name;
    data.tagline = document.getElementById('a-tagline').value.trim();
    data.photo   = adminPhoto;
    // Collect links from inputs
    data.links = adminLinks.map(function(l) {
      var labelEl = document.getElementById('ll-' + l.id);
      var urlEl   = document.getElementById('lu-' + l.id);
      return {
        id:      l.id,
        label:   labelEl ? labelEl.value.trim() : l.label,
        url:     urlEl   ? urlEl.value.trim()   : l.url,
        visible: l.visible
      };
    }).filter(function(l){ return l.label; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    renderPage();
    var msg = document.getElementById('savedMsg');
    msg.classList.add('show');
    setTimeout(function(){ msg.classList.remove('show'); }, 2000);
  }

  // ─── PHOTO UPLOAD ───
  function handlePhotoUpload(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var size = Math.min(img.width, img.height, 400);
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var sx = (img.width  - size) / 2;
        var sy = (img.height - size) / 2;
        ctx.drawImage(img, sx, sy, size, size, 0, 0, size, size);
        adminPhoto = canvas.toDataURL('image/jpeg', 0.82);
        renderAdminPhoto();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderAdminPhoto() {
    var preview = document.getElementById('adminAvatarPreview');
    if (adminPhoto) {
      preview.innerHTML = '<img src="' + adminPhoto + '" style="width:100%;height:100%;object-fit:cover;" />';
    } else {
      var name = document.getElementById('a-name').value || data.name;
      preview.innerHTML = '<span class="preview-initials">' + getInitials(name) + '</span>';
    }
  }

  // ─── LINK MANAGER ───
  function renderLinkManager() {
    var list = document.getElementById('linkManagerList');
    list.innerHTML = '';
    adminLinks.forEach(function(link, i) {
      var item = document.createElement('div');
      item.className = 'link-manager-item' + (link.visible ? '' : ' hidden-link');
      item.id = 'litem-' + link.id;

      // Order buttons
      var orderWrap = document.createElement('div'); orderWrap.className = 'link-order-btns';
      var upBtn = document.createElement('button'); upBtn.className = 'link-order-btn'; upBtn.textContent = '▲';
      upBtn.disabled = i === 0;
      upBtn.onclick = function(){ moveLink(i, -1); };
      var dnBtn = document.createElement('button'); dnBtn.className = 'link-order-btn'; dnBtn.textContent = '▼';
      dnBtn.disabled = i === adminLinks.length - 1;
      dnBtn.onclick = function(){ moveLink(i, 1); };
      orderWrap.appendChild(upBtn); orderWrap.appendChild(dnBtn);

      // Label
      var labelInput = document.createElement('input');
      labelInput.className = 'link-label-input'; labelInput.value = link.label;
      labelInput.id = 'll-' + link.id; labelInput.placeholder = 'Label';

      // URL
      var urlInput = document.createElement('input');
      urlInput.className = 'link-url-input'; urlInput.value = link.url;
      urlInput.id = 'lu-' + link.id; urlInput.placeholder = 'URL';

      // Visibility
      var visBtn = document.createElement('button');
      visBtn.className = 'link-vis-btn' + (link.visible ? '' : ' is-hidden');
      visBtn.textContent = link.visible ? '👁' : '👁';
      visBtn.title = link.visible ? 'Hide' : 'Show';
      visBtn.onclick = function(){ toggleLinkVis(i); };

      // Delete
      var delBtn = document.createElement('button');
      delBtn.className = 'link-del-btn'; delBtn.textContent = '×';
      delBtn.onclick = function(){ deleteLink(i); };

      item.appendChild(orderWrap);
      item.appendChild(labelInput);
      item.appendChild(urlInput);
      item.appendChild(visBtn);
      item.appendChild(delBtn);
      list.appendChild(item);
    });
  }

  function syncLinksFromDOM() {
    adminLinks = adminLinks.map(function(l) {
      var labelEl = document.getElementById('ll-' + l.id);
      var urlEl   = document.getElementById('lu-' + l.id);
      return {
        id:      l.id,
        label:   labelEl ? labelEl.value : l.label,
        url:     urlEl   ? urlEl.value   : l.url,
        visible: l.visible
      };
    });
  }

  function moveLink(i, dir) {
    syncLinksFromDOM();
    var j = i + dir;
    if (j < 0 || j >= adminLinks.length) return;
    var tmp = adminLinks[i]; adminLinks[i] = adminLinks[j]; adminLinks[j] = tmp;
    renderLinkManager();
  }

  function toggleLinkVis(i) {
    syncLinksFromDOM();
    adminLinks[i].visible = !adminLinks[i].visible;
    renderLinkManager();
  }

  function deleteLink(i) {
    syncLinksFromDOM();
    adminLinks.splice(i, 1);
    renderLinkManager();
  }

  function addLink() {
    syncLinksFromDOM();
    adminLinks.push({ id: nextId++, label: '', url: '', visible: true });
    renderLinkManager();
    // Focus the new label input
    var last = adminLinks[adminLinks.length - 1];
    setTimeout(function(){
      var el = document.getElementById('ll-' + last.id);
      if (el) el.focus();
    }, 50);
  }

  // URL param ?admin to open directly
  if (new URLSearchParams(window.location.search).get('admin') !== null) {
    setTimeout(openAdminGate, 200);
  }

  // Init
  renderPage();
</script>
</body>
</html>
